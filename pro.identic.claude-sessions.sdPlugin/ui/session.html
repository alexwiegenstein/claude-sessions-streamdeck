<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8" />
		<title>Claude Session</title>
		<style>
			body { margin: 0; padding: 12px 16px; font: 12px -apple-system, "Helvetica Neue", sans-serif; color: #d8d8d8; background: #2d2d2d; }
			.row { display: flex; align-items: center; gap: 8px; }
			label { flex: 0 0 92px; text-align: right; color: #969696; }
			input { width: 64px; padding: 5px 6px; border: 1px solid #555; border-radius: 3px; background: #3d3d3d; color: #fff; font: inherit; }
			input:invalid { border-color: #ff453a; }
			p { margin: 10px 0 0 100px; color: #969696; line-height: 1.4; }
		</style>
	</head>
	<body>
		<div class="row">
			<label for="hours">Bereit zeigen</label>
			<input id="hours" type="number" min="0" step="0.5" required />
			<span>Stunden</span>
		</div>
		<p>
			So lange bleibt eine angesehene, ruhende Session nach ihrer letzten Aktivität auf der Taste. Gilt für alle Tasten. Laufende
			Sessions, Rückfragen, Freigaben und ungesehene Ergebnisse bleiben immer sichtbar.
		</p>
		<script>
			const DEFAULT_HOURS = 8;
			const input = document.getElementById("hours");

			// Stream Deck ruft diese Funktion auf, sobald die Einstellungen geöffnet werden.
			window.connectElgatoStreamDeckSocket = (port, uuid, registerEvent) => {
				const socket = new WebSocket(`ws://127.0.0.1:${port}`);
				const send = (event, payload) => socket.send(JSON.stringify({ event, context: uuid, payload }));
				let settings = {};

				socket.addEventListener("open", () => {
					socket.send(JSON.stringify({ event: registerEvent, uuid }));
					send("getGlobalSettings");
				});
				socket.addEventListener("message", (message) => {
					const data = JSON.parse(message.data);
					if (data.event !== "didReceiveGlobalSettings") return;
					settings = data.payload.settings;
					if (document.activeElement !== input) input.value = settings.recentHours ?? DEFAULT_HOURS;
				});
				input.addEventListener("input", () => {
					if (!input.checkValidity()) return;
					settings = { ...settings, recentHours: input.valueAsNumber };
					send("setGlobalSettings", settings);
				});
			};
		</script>
	</body>
</html>
