<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Claude Session</title>
		<style>
			body { margin: 0; padding: 12px 16px; font: 12px -apple-system, "Helvetica Neue", sans-serif; color: #d8d8d8; background: #2d2d2d; }
			.row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
			.row:first-child { margin-top: 0; }
			label { flex: 0 0 92px; text-align: right; color: #969696; }
			input, select { padding: 5px 6px; border: 1px solid #555; border-radius: 3px; background: #3d3d3d; color: #fff; font: inherit; }
			input { width: 64px; }
			input:invalid { border-color: #ff453a; }
			p { margin: 6px 0 0 100px; color: #969696; line-height: 1.4; }
		</style>
	</head>
	<body>
		<div class="row">
			<label for="language">Language</label>
			<select id="language">
				<option value="en">English</option>
				<option value="de">Deutsch</option>
			</select>
		</div>
		<p>Language of the words on the keys.</p>
		<div class="row">
			<label for="hours">Keep idle for</label>
			<input id="hours" type="number" min="0" step="0.5" required />
			<span>hours</span>
		</div>
		<p>
			How long an idle session you have already looked at stays on its key after its last activity. Running sessions, questions,
			permission requests and unseen results always stay visible.
		</p>
		<p>Both settings apply to all keys.</p>
		<script>
			const DEFAULTS = { recentHours: 8, language: "en" };
			const hours = document.getElementById("hours");
			const language = document.getElementById("language");

			// Stream Deck calls this function as soon as the settings are opened.
			window.connectElgatoStreamDeckSocket = (port, uuid, registerEvent) => {
				const socket = new WebSocket(`ws://127.0.0.1:${port}`);
				const send = (event, payload) => socket.send(JSON.stringify({ event, context: uuid, payload }));
				let settings = {};

				socket.addEventListener("open", () => {
					socket.send(JSON.stringify({ event: registerEvent, uuid }));
					send("getGlobalSettings");
				});
				socket.addEventListener("message", (message) => {
					const data = JSON.parse(message.data);
					if (data.event !== "didReceiveGlobalSettings") return;
					settings = data.payload.settings;
					if (document.activeElement !== hours) hours.value = settings.recentHours ?? DEFAULTS.recentHours;
					language.value = settings.language ?? DEFAULTS.language;
				});
				hours.addEventListener("input", () => {
					if (!hours.checkValidity()) return;
					settings = { ...settings, recentHours: hours.valueAsNumber };
					send("setGlobalSettings", settings);
				});
				language.addEventListener("change", () => {
					settings = { ...settings, language: language.value };
					send("setGlobalSettings", settings);
				});
			};
		</script>
	</body>
</html>
